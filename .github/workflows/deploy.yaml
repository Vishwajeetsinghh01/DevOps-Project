name: Deploy to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Chatbot
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/chatbot:latest ./app/chatbot
        docker push ${{ secrets.DOCKER_USERNAME }}/chatbot:latest

    - name: Build and Push Store
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/store:latest ./app/store
        docker push ${{ secrets.DOCKER_USERNAME }}/store:latest

    - name: Copy Deployment Blueprint to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "deployment.yaml"
        target: "/home/ubuntu/"

    - name: Deploy to Kubernetes
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. UNLOCK the config file (This fixes the Permission Denied error)
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          
          # 2. Point kubectl to the config
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          
          # 3. Apply the Blueprint
          kubectl apply -f /home/ubuntu/deployment.yaml
          
          # 4. THE HAMMER: Kill old pods directly 🔨
          # This forces K8s to download the new code immediately
          kubectl delete pods -l app=store
          kubectl delete pods -l app=chatbot
          
          # 5. Wait 10 seconds and check status
          sleep 10
          kubectl get pods